parameters:
    env(UNIVERSALREADING_ARTICLE_REPORTING_URL): ''
    universalreading.article_reporting_url: '%env(UNIVERSALREADING_ARTICLE_REPORTING_URL)%'
    universalreading.version: 2.7.0-alpha.1
    universalreading.paypal_url: "https://liberapay.com/universalreading/donate"
    universalreading.languages:
        en: 'English'
        fr: 'Français'
        de: 'Deutsch'
        nl: 'Dutch'
        th: 'ไทย'
        tr: 'Türkçe'
        fa: 'فارسی'
        ro: 'Română'
        pl: 'Polish'
        da: 'Dansk'
        es: 'Español'
        oc: 'Occitan'
        it: 'Italiano'
        pt: 'Português'
        ru: 'Русский'
        ja: '日本語'
        ko: '한국어'
        zh: '简体中文'
        uk: 'Українська'
        hr: 'Hrvatski'
        cs: 'Čeština'
        el: 'Ελληνικά'
        gl: 'Galego'
    universalreading.items_on_page: 12
    universalreading.feed_limit: 50
    universalreading.reading_speed: 200
    universalreading.cache_lifetime: 10
    universalreading.action_mark_as_read: 1
    universalreading.list_mode: 0
    universalreading.display_thumbnails: 1
    universalreading.fetching_error_message_title: 'No title found'
    universalreading.fetching_error_message: |
        universalreading can't retrieve contents for this article. Please <a href="https://doc.universalreading.org/en/user/errors_during_fetching.html#how-can-i-help-to-fix-that">troubleshoot this issue</a>.
    universalreading.api_limit_mass_actions: 10
    universalreading.site_credentials.encryption_key_path: "%kernel.project_dir%/data/site-credentials-secret-key.txt"
    universalreading.default_internal_settings:
        -
            name: share_public
            value: 1
            section: entry
        -
            name: share_diaspora
            value: 1
            section: entry
        -
            name: diaspora_url
            value: https://diasporapod.com
            section: entry
        -
            name: share_unmark
            value: 1
            section: entry
        -
            name: unmark_url
            value: https://unmark.it
            section: entry
        -
            name: share_shaarli
            value: 1
            section: entry
        -
            name: shaarli_url
            value: https://myshaarli.com
            section: entry
        -
            name: share_linkding
            value: 1
            section: entry
        -
            name: linkding_url
            value: https://linkding.example.com
            section: entry
        -
            name: share_mail
            value: 1
            section: entry
        -
            name: share_twitter
            value: 1
            section: entry
        -
            name: show_printlink
            value: 1
            section: entry
        -
            name: restricted_access
            value: 0
            section: entry
        -
            name: export_epub
            value: 1
            section: export
        -
            name: export_pdf
            value: 1
            section: export
        -
            name: export_csv
            value: 1
            section: export
        -
            name: export_json
            value: 1
            section: export
        -
            name: export_txt
            value: 1
            section: export
        -
            name: export_xml
            value: 1
            section: export
        -
            name: export_md
            value: 1
            section: export
        -
            name: import_with_redis
            value: 0
            section: import
        -
            name: import_with_rabbitmq
            value: 0
            section: import
        -
            name: matomo_enabled
            value: 0
            section: analytics
        -
            name: matomo_host
            value: matomo.universalreading.org
            section: analytics
        -
            name: matomo_site_id
            value: 1
            section: analytics
        -
            name: download_images_enabled
            value: 0
            section: misc
        -
            name: universalreading_support_url
            value: https://github.com/universalreading/universalreading/issues/new/choose
            section: misc
        -
            name: api_user_registration
            value: 0
            section: api
        -
            name: store_article_headers
            value: 0
            section: entry
        -
            name: shaarli_share_origin_url
            value: 0
            section: entry

    universalreading.default_ignore_origin_instance_rules:
        -
            rule: host = "feedproxy.google.com"
        -
            rule: host = "feeds.reuters.com"
        -
            rule: _all ~ "https?://www\.lemonde\.fr/tiny.*"
    universalreading.fonts:
        - 'Sans-serif'
        - 'Serif'
        - 'Atkinson Hyperlegible'
        - 'EB Garamond'
        - 'Lato'
        - 'Montserrat'
        - 'OpenDyslexicRegular'
        - 'Oswald'
    universalreading.allow_mimetypes:
        - 'application/octet-stream'
        - 'application/json'
        - 'text/plain'
        - 'text/csv'
        - 'text/html'
        - 'application/vnd.ms-excel'
    universalreading.resource_dir: "%kernel.project_dir%/var/import"
