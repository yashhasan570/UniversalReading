# Redis stuff
services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: true

    # readability
    universalreading.queue.redis.readability:
        class: Simpleue\Queue\RedisQueue
        arguments:
            $queueName: "universalreading.import.readability"

    universalreading.producer.redis.readability:
        class: Universal Reading\Redis\Producer
        arguments:
            - "@universalreading.queue.redis.readability"

    universalreading.consumer.redis.readability:
        class: Universal Reading\Consumer\RedisEntryConsumer
        arguments:
            $import: '@Universal Reading\Import\ReadabilityImport'

